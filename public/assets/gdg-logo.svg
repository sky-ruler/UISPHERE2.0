<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none" width="100%" height="100%">
  <style>
    .gdg-text-title { font-family: 'Space Grotesk', -apple-system, sans-serif; font-size: 24px; font-weight: 700; fill: #111111; letter-spacing: -0.03em; }
    .gdg-text-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; fill: #4285F4; letter-spacing: 0.08em; }
    .gdg-text-meta { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; font-size: 11px; font-weight: 500; fill: #71717A; letter-spacing: 0.02em; }
    @media (prefers-color-scheme: dark) {
      .gdg-text-title { fill: #F4F4F5; }
      .gdg-text-meta { fill: #A1A1AA; }
    }
  </style>
  <!-- Centered GDG Emblem -->
  <g transform="translate(100, 8)">
    <!-- Left Bracket < -->
    <!-- Top Red Pill -->
    <rect x="36.5" y="6" width="38" height="15" rx="7.5" transform="rotate(45 36.5 6)" fill="#EA4335" />
    <!-- Bottom Blue Pill -->
    <rect x="9.5" y="47.5" width="38" height="15" rx="7.5" transform="rotate(-45 9.5 47.5)" fill="#4285F4" />
    
    <!-- Right Bracket > -->
    <!-- Top Green Pill -->
    <rect x="56.5" y="33" width="38" height="15" rx="7.5" transform="rotate(-45 56.5 33)" fill="#34A853" />
    <!-- Bottom Yellow Pill -->
    <rect x="83.5" y="20" width="38" height="15" rx="7.5" transform="rotate(45 83.5 20)" fill="#FBBC05" />
  </g>

  <!-- Typography Stacked & Centered -->
  <text x="160" y="112" text-anchor="middle" class="gdg-text-title">Google Developer Group</text>
  <text x="160" y="136" text-anchor="middle" class="gdg-text-sub">SOA ITER CHAPTER &bull; BHUBANESWAR</text>
  <text x="160" y="156" text-anchor="middle" class="gdg-text-meta">Official Student Community &bull; Batch 2026&ndash;27</text>
</svg>
